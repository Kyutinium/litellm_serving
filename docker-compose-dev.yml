services:
  litellm_dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    network_mode: host
    environment:
      - LITELLM_MASTER_KEY=sk-1234
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - NO_PROXY=localhost,127.0.0.1
      - no_proxy=localhost,127.0.0.1
      - LITELLM_PORT=3999
      - UPSTREAM_BASE_URL=http://localhost:3999
      # Sanitizer listens here; point clients' ANTHROPIC_BASE_URL at it.
      - SANITIZER_PORT=5501
      - SANITIZER_USE_OPENAI_BRIDGE=true
      # Per-model effort levels the upstream accepts (JSON: model name as the
      # client sends it -> levels). Unset = forward verbatim, which is a 400 on
      # a build that does not know the level the caller sent (#26):
      #   Unexpected reasoning effort high. Supported types are xhigh
      #   (default), medium, and low.
      # That set is what the vLLM behind ChatDRAGON-Medium reported. List every
      # alias clients send (names are case-sensitive); one typo invalidates the
      # whole setting and the sanitizer refuses to start.
      # - SANITIZER_EFFORT_VOCABULARY={"qwen3.6-27b":"low,medium,xhigh","Qwen3.6-27B":"low,medium,xhigh"}
      - THINK_OUTPUT_MODE=default
      - LOG_LEVEL=INFO
    volumes:
      # Bind-mount sanitizer + config for fast iteration (no rebuild on edit).
      - ./sanitizer:/app/sanitizer:ro
      - ./litellm_config.yaml:/app/config.yaml:ro
      - ./strip_thinking.py:/app/strip_thinking.py:ro
