services:
  litellm_dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    network_mode: host
    environment:
      - LITELLM_MASTER_KEY=sk-1234
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - NO_PROXY=localhost,127.0.0.1
      - no_proxy=localhost,127.0.0.1
      - LITELLM_PORT=3999
      - UPSTREAM_BASE_URL=http://localhost:3999
      # Sanitizer listens here; point clients' ANTHROPIC_BASE_URL at it.
      - SANITIZER_PORT=5501
      - SANITIZER_USE_OPENAI_BRIDGE=true
      # Effort levels are LEARNED per model: the sanitizer probes each listed
      # model at startup (SANITIZER_EFFORT_PROBE, default true; uses
      # LITELLM_MASTER_KEY above) and reads the vocabulary a vLLM build names in
      # its 400 ("Unexpected reasoning effort high. Supported types are xhigh
      # (default), medium, and low." — #26), retrying the request once. What it
      # knows is published on /v1/models as effort_levels for the gateway.
      # Manual override only for an upstream that states nothing (JSON: model
      # name as the client sends it -> levels; one typo invalidates the whole
      # setting and the sanitizer refuses to start):
      # - SANITIZER_EFFORT_VOCABULARY={"qwen3.6-27b":"low,medium,xhigh","Qwen3.6-27B":"low,medium,xhigh"}
      - THINK_OUTPUT_MODE=default
      - LOG_LEVEL=INFO
      # 모델이 실제로 받는 요청 기록 — 기본 꺼짐. 켜면 사용자 대화·도구 결과가 디스크에
      # 남으므로 볼륨·권한·보존 기간을 정하고 켠다(README "모델이 실제로 받는 요청 기록").
      - PROMPT_CAPTURE=false
      - PROMPT_CAPTURE_DIR=/app/prompt_captures
      - PROMPT_CAPTURE_RETENTION_DAYS=7
      - PROMPT_CAPTURE_MAX_MB=2048
    volumes:
      # Bind-mount sanitizer + config for fast iteration (no rebuild on edit).
      - ./sanitizer:/app/sanitizer:ro
      - ./litellm_config.yaml:/app/config.yaml:ro
      - ./strip_thinking.py:/app/strip_thinking.py:ro
      - ./prompt_capture.py:/app/prompt_capture.py:ro
      - ./prompt_captures:/app/prompt_captures
