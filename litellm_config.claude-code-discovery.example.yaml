# Claude Code gateway model discovery — 예시 설정
#
# 목적: CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY=1 로 띄운 Claude Code의
# /model 픽커에 LiteLLM 등록 모델들이 "From gateway"로 뜨게 한다.
#
# 동작 원리 (claude-code 2.1.251 실측, oh-my-gateway#157):
#   1. Claude Code가 ANTHROPIC_BASE_URL(= sanitizer)로 GET /v1/models?limit=1000 을 보낸다.
#      sanitizer 는 POST /v1/messages 외 전부를 상류(LiteLLM)로 그대로 릴레이하므로
#      이 요청은 이미 LiteLLM 까지 도달한다. 별도 설정 불필요.
#   2. Claude Code는 응답에서 id에 `claude` 또는 `anthropic`이 **포함된** 모델만 남긴다.
#      (부분 문자열 매치다. 문서들이 말하는 "접두사"가 아니다 — 앵커 없는
#       /(claude|anthropic)/i 정규식을 바이너리에서 확인했다.)
#   3. 남은 모델이 /model 픽커에 "From gateway"로 뜨고, 선택하면 그 id가
#      문자 그대로 /v1/messages 의 model 로 온다. 그래서 아래 별칭의
#      model_name 문자열이 곧 픽커에 뜨는 이름이자 라우팅 키다.
#
# 이 파일은 litellm_config.yaml(이 커밋 시점)에 `claude-*` 별칭 7개(실모델 7종, 대소문자 중복 제외)를 추가한
# 전체 예시다. 기존 이름은 전부 유지되므로 기존 호출자는 영향이 없다.
#
# E2E 검증: 이 파일 그대로(실제 LiteLLM proxy + 실제 sanitizer + claude-code 2.1.251)
#   [gatewayDiscovery] cached 7 models
# 가 기록되고 7개 전부 픽커 캐시(cache/gateway-models.json)에 실렸다.
#
# ⚠️ 컨텍스트 윈도 주의: Claude Code는 미인식 모델 id의 윈도를 200k로 가정한다.
#   실제 32k 모델이면 상류가 먼저 거부할 수 있다. README의
#   "Claude Code 모델 디스커버리" 절의 CLAUDE_CODE_MAX_CONTEXT_TOKENS 안내 참고.

model_list:
