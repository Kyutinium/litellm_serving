services:
  litellm:
    build: .
    network_mode: host
    environment:
      - LITELLM_MASTER_KEY=sk-1234
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - NO_PROXY=localhost,127.0.0.1
      - no_proxy=localhost,127.0.0.1
      - OPENAI_API_BASE=http://localhost:8088/v1
      - THINK_OUTPUT_MODE=none
      # The image runs LiteLLM on :3999 and the sanitizer in front on :3996.
      # Clients (oh-my-gateway ANTHROPIC_BASE_URL) should use :3996 — that is
      # where each model's learned effort levels ride GET /v1/models as
      # ``effort_levels`` and where an unsupported level is clamped instead of
      # reaching vLLM as a 400. The probe authenticates with LITELLM_MASTER_KEY.
      - LITELLM_PORT=3999
      - SANITIZER_PORT=3996
      - UPSTREAM_BASE_URL=http://localhost:3999
