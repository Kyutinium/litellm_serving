services:
  litellm:
    build: .
    network_mode: host
    environment:
      - LITELLM_MASTER_KEY=sk-1234
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - NO_PROXY=localhost,127.0.0.1
      - no_proxy=localhost,127.0.0.1
      - OPENAI_API_BASE=http://localhost:8088/v1
      - THINK_OUTPUT_MODE=none
      # The image runs LiteLLM on :3999 and the sanitizer in front on :3996.
      # Clients (oh-my-gateway ANTHROPIC_BASE_URL) should use :3996 — that is
      # where each model's learned effort levels ride GET /v1/models as
      # ``effort_levels`` and where an unsupported level is clamped instead of
      # reaching vLLM as a 400. The probe authenticates with LITELLM_MASTER_KEY.
      - LITELLM_PORT=3999
      - SANITIZER_PORT=3996
      - UPSTREAM_BASE_URL=http://localhost:3999
      # The bridge must be on for the published effort_levels to describe the
      # path /v1/messages clients actually take: it carries output_config.effort
      # onto the same /v1/chat/completions reasoning_effort field the levels were
      # learned on (clamped to that set). Off = raw relay to LiteLLM's Anthropic
      # adapter, where neither the translation nor the clamp applies.
      - SANITIZER_USE_OPENAI_BRIDGE=true
      # 모델이 실제로 받는 요청 기록 — 기본 꺼짐. 켜면 사용자 대화·도구 결과가 디스크에
      # 남으므로 볼륨·권한·보존 기간을 정하고 켠다(README "모델이 실제로 받는 요청 기록").
      # 같은 모델의 vLLM 여러 대를 실제 부하 기준으로 나눈다(README "vLLM 여러 대에 부하 기준으로
      # 나누기", issue #31). 켜려면 주석을 풀고 litellm_config.yaml의 그 모델 api_base를
      # http://localhost:3997/<pool>/v1 로 바꾼다. 비우면 balancer는 뜨지 않는다.
      # - 'BALANCER_POOLS={"glm-5.1-fp8":["http://10.0.0.1:8089","http://10.0.0.2:8089"]}'
      - PROMPT_CAPTURE=false
      - PROMPT_CAPTURE_DIR=/app/prompt_captures
      - PROMPT_CAPTURE_RETENTION_DAYS=7
      # 매 턴 시스템 프롬프트·도구·대화 기록 전체가 다시 실리므로 넉넉히 둔다(중복은 한 번만 저장).
      # 볼륨에 이만큼의 여유가 실제로 있어야 한다 — 상한은 이 디렉터리만 지킨다.
      - PROMPT_CAPTURE_MAX_MB=102400
    volumes:
      # PROMPT_CAPTURE=true일 때 기록이 컨테이너 재생성에도 남게 한다
      - ./prompt_captures:/app/prompt_captures
